{{- if .Values.kafka.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  namespace: {{ .Values.namespace }}
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        job: kafka-topics-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics-init
          image: node:18-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              npm init -y >/dev/null 2>&1 &&
              npm add kafkajs >/dev/null 2>&1 &&
              node - <<'EOF'
              const { Kafka } = require('kafkajs');
              const brokers = (process.env.KAFKA_BROKERS || '').split(',').filter(Boolean);
              const kafka = new Kafka({ clientId: 'kafka-topic-manager', brokers });
              const admin = kafka.admin();
              const TOPICS = [
                'user.created','user.updated','user.deleted',
                'order.created','order.updated','order.cancelled','order.paid','order.ready',
                'driver.assigned','driver.location.updated','driver.status.updated',
                'restaurant.created','restaurant.updated'
              ];
              (async () => {
                const wait = ms => new Promise(r => setTimeout(r, ms));
                while (true) {
                  try {
                    await admin.connect();
                    break;
                  } catch (e) {
                    console.log('Kafka not ready yet, retrying...');
                    await wait(5000);
                  }
                }
                const existing = await admin.listTopics();
                const toCreate = TOPICS.filter(t => !existing.includes(t)).map(t => ({ topic: t, numPartitions: 1, replicationFactor: 3 }));
                if (toCreate.length) {
                  await admin.createTopics({ topics: toCreate, waitForLeaders: true });
                  console.log('Created topics:', toCreate.map(t => t.topic));
                } else {
                  console.log('All topics already exist');
                }
                await admin.disconnect();
              })().catch(async (e) => { console.error(e); process.exit(1); });
              EOF
          env:
            - name: KAFKA_BROKERS
              value: {{ .Values.common.kafkaBrokers | quote }}
{{- end }}

